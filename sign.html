
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlueWatch | Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #041526, #082b45, #07516c);
            padding: 25px;
            color: #e5f3ff;
        }

        .signup-container {
            width: 100%;
            max-width: 495px;
            background: #0e2b45;
            border: 1px solid #075b79;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 35px;
            font-weight: bold;
            color: #00d9f5;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #a7bfd0;
            margin-bottom: 32px;
            font-size: 15px;
        }

        h2 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #a7bfd0;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            color: #d5e6f2;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #071d32;
            border: 1px solid #24506b;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00d9f5;
            box-shadow: 0 0 7px rgba(0, 217, 245, 0.2);
        }

        input::placeholder {
            color: #7892a7;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-btn {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #00d9f5;
            cursor: pointer;
            font-size: 14px;
        }

        .signup-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00bcd4, #00e5ff);
            color: #031a2b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 7px;
        }

        .signup-btn:hover {
            opacity: 0.9;
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .bottom-text {
            text-align: center;
            margin-top: 25px;
            color: #a7bfd0;
            font-size: 14px;
        }

        .bottom-text a {
            color: #00d9f5;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 22px;
            text-align: center;
            font-size: 14px;
        }

        .message.success {
            display: block;
            color: #8fffd8;
            background: #064b4b;
        }

        .message.error {
            display: block;
            color: #ffaaaa;
            background: #54232b;
        }

        @media (max-width: 500px) {
            .signup-container {
                padding: 28px 22px;
            }

            .logo {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">🌊 BLUEWATCH</div>

        <p class="subtitle">
            Marine Weather Intelligence Platform
        </p>

        <h2>Create Account</h2>

        <p class="description">
            Join BlueWatch to explore marine weather forecasts
        </p>

        <!-- Backend response message -->
        <p id="message" class="message" role="status"></p>

        <!-- Signup Form -->
        <form id="signupForm">

            <div class="input-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-btn"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-btn"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>
            </div>

            <button
                type="submit"
                class="signup-btn"
                id="signupBtn"
            >
                Create Account
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

    </div>

    <!-- External JavaScript connection -->
    <script src="script.js"></script>

</body>
</html>
