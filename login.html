
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlueWatch | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #061a35, #073b63, #087e9e);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #087e9e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #082f49;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #0891b2;
            box-shadow: 0 0 5px rgba(8, 145, 178, 0.3);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #087e9e;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #087e9e, #06b6d4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .bottom-text a {
            color: #087e9e;
            font-weight: bold;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            color: #dc2626;
            background: #fee2e2;
        }

        .message.success {
            display: block;
            color: #15803d;
            background: #dcfce7;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }

            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🌊 BlueWatch</div>

        <p class="subtitle">
            Marine Weather & Ecosystem Intelligence
        </p>

        <h2>Welcome Back!</h2>

        <!-- Login Form -->
        <form id="loginForm">

            <div class="input-group">
                <label for="loginEmail">Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="loginPassword">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-btn"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        Show
                    </button>

                </div>
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

            <!-- Backend response -->
            <p id="message" class="message" role="status"></p>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="sign.html">Create Account</a>
        </p>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
